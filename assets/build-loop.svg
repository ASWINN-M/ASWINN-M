<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-label="How I build loop">
  <defs>
    <linearGradient id="strip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="50%" stop-color="#0d2a34"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" rx="16" fill="url(#strip)"/>
  <rect x="1" y="1" width="1198" height="198" rx="16" fill="none" stroke="#33c2cc" stroke-opacity="0.2"/>

  <text x="40" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#7eb8bf">HOW I SHIP</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#e8fbff">
    <!-- steps -->
    <rect x="40" y="70" width="190" height="88" rx="12" fill="#0a1a22" stroke="#33c2cc" stroke-opacity="0.45"/>
    <text x="135" y="108" text-anchor="middle" font-size="12" fill="#7eb8bf">01</text>
    <text x="135" y="132" text-anchor="middle" font-weight="700">Clear goal</text>

    <text x="250" y="118" fill="#33c2cc" font-size="22">’</text>

    <rect x="280" y="70" width="190" height="88" rx="12" fill="#0a1a22" stroke="#33c2cc" stroke-opacity="0.45"/>
    <text x="375" y="108" text-anchor="middle" font-size="12" fill="#7eb8bf">02</text>
    <text x="375" y="132" text-anchor="middle" font-weight="700">Tools / retrieval</text>

    <text x="490" y="118" fill="#33c2cc" font-size="22">’</text>

    <rect x="520" y="70" width="190" height="88" rx="12" fill="#0a1a22" stroke="#57db96" stroke-opacity="0.5"/>
    <text x="615" y="108" text-anchor="middle" font-size="12" fill="#7eb8bf">03</text>
    <text x="615" y="132" text-anchor="middle" font-weight="700">Tight memory</text>

    <text x="730" y="118" fill="#33c2cc" font-size="22">’</text>

    <rect x="760" y="70" width="190" height="88" rx="12" fill="#0a1a22" stroke="#57db96" stroke-opacity="0.5"/>
    <text x="855" y="108" text-anchor="middle" font-size="12" fill="#7eb8bf">04</text>
    <text x="855" y="132" text-anchor="middle" font-weight="700">Eval on real data</text>

    <text x="970" y="118" fill="#33c2cc" font-size="22">’</text>

    <rect x="1000" y="70" width="160" height="88" rx="12" fill="#0a1a22" stroke="#33c2cc" stroke-opacity="0.7"/>
    <text x="1080" y="108" text-anchor="middle" font-size="12" fill="#7eb8bf">05</text>
    <text x="1080" y="132" text-anchor="middle" font-weight="700">Ship UI</text>
  </g>
</svg>
