<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Focus areas: Agents, RAG, Vision OCR">
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2230"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33c2cc"/>
      <stop offset="100%" stop-color="#57db96"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="18" fill="#071018"/>

  <!-- Panel 1: Agents -->
  <g transform="translate(24,24)">
    <rect width="368" height="312" rx="16" fill="url(#panel)" stroke="#33c2cc" stroke-opacity="0.35"/>
    <text x="28" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#7eb8bf">01</text>
    <text x="28" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8fbff">AI Agents</text>
    <text x="28" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fd8df">Tool-calling graphs with memory</text>

    <!-- hex agent glyph -->
    <g transform="translate(110,150)" stroke="url(#accent1)" stroke-width="2" fill="none" opacity="0.9">
      <polygon points="74,8 128,40 128,104 74,136 20,104 20,40"/>
      <polygon points="74,36 104,54 104,90 74,108 44,90 44,54"/>
      <circle cx="74" cy="72" r="12" fill="#0b1a22" stroke="#33c2cc"/>
      <text x="74" y="77" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#33c2cc" stroke="none">AI</text>
    </g>
    <text x="28" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7eb8bf">LangGraph · MCP · decisions</text>
  </g>

  <!-- Panel 2: RAG -->
  <g transform="translate(416,24)">
    <rect width="368" height="312" rx="16" fill="url(#panel)" stroke="#57db96" stroke-opacity="0.35"/>
    <text x="28" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#7eb8bf">02</text>
    <text x="28" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8fbff">RAG Systems</text>
    <text x="28" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fd8df">Grounded answers over real docs</text>

    <!-- doc + vector glyph -->
    <g transform="translate(95,155)">
      <rect x="20" y="10" width="70" height="90" rx="6" fill="#0b1a22" stroke="#57db96" stroke-width="2"/>
      <line x1="34" y1="32" x2="76" y2="32" stroke="#57db96" stroke-opacity="0.7" stroke-width="2"/>
      <line x1="34" y1="48" x2="76" y2="48" stroke="#57db96" stroke-opacity="0.5" stroke-width="2"/>
      <line x1="34" y1="64" x2="64" y2="64" stroke="#57db96" stroke-opacity="0.4" stroke-width="2"/>
      <g transform="translate(110,20)">
        <circle cx="20" cy="20" r="6" fill="#33c2cc"/>
        <circle cx="50" cy="12" r="5" fill="#57db96"/>
        <circle cx="48" cy="42" r="7" fill="#33c2cc" opacity="0.85"/>
        <circle cx="18" cy="48" r="4" fill="#57db96"/>
        <line x1="20" y1="20" x2="50" y2="12" stroke="#33c2cc" stroke-opacity="0.5"/>
        <line x1="50" y1="12" x2="48" y2="42" stroke="#57db96" stroke-opacity="0.5"/>
        <line x1="48" y1="42" x2="18" y2="48" stroke="#33c2cc" stroke-opacity="0.45"/>
        <line x1="18" y1="48" x2="20" y2="20" stroke="#57db96" stroke-opacity="0.45"/>
      </g>
    </g>
    <text x="28" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7eb8bf">Embeddings · Chroma / FAISS</text>
  </g>

  <!-- Panel 3: OCR -->
  <g transform="translate(808,24)">
    <rect width="368" height="312" rx="16" fill="url(#panel)" stroke="#33c2cc" stroke-opacity="0.35"/>
    <text x="28" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#7eb8bf">03</text>
    <text x="28" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8fbff">Vision + OCR</text>
    <text x="28" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fd8df">Multilingual text from images</text>

    <!-- scan frame glyph -->
    <g transform="translate(115,155)" fill="none" stroke="#33c2cc" stroke-width="2.5">
      <path d="M20 40 V20 H40"/>
      <path d="M140 40 V20 H120"/>
      <path d="M20 100 V120 H40"/>
      <path d="M140 100 V120 H120"/>
      <rect x="40" y="40" width="80" height="60" rx="4" stroke="#57db96" stroke-opacity="0.8"/>
      <line x1="50" y1="58" x2="110" y2="58" stroke="#e8fbff" stroke-opacity="0.55" stroke-width="2"/>
      <line x1="50" y1="72" x2="98" y2="72" stroke="#e8fbff" stroke-opacity="0.35" stroke-width="2"/>
      <line x1="30" y1="70" x2="130" y2="70" stroke="#57db96" stroke-opacity="0.9" stroke-width="1.5">
        <animate attributeName="y1" values="45;95;45" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="45;95;45" dur="2.8s" repeatCount="indefinite"/>
      </line>
    </g>
    <text x="28" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7eb8bf">PaddleOCR · translate · TTS</text>
  </g>
</svg>
