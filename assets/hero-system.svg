<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="AI agent system map">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="55%" stop-color="#0b2430"/>
      <stop offset="100%" stop-color="#0f3a3d"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#33c2cc" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#33c2cc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#57db96" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12303a"/>
      <stop offset="100%" stop-color="#0a1a22"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#33c2cc" stroke-opacity="0.22"/>

  <!-- grid dots -->
  <g fill="#33c2cc" opacity="0.12">
    <circle cx="80" cy="60" r="2"/><circle cx="140" cy="60" r="2"/><circle cx="200" cy="60" r="2"/>
    <circle cx="80" cy="100" r="2"/><circle cx="140" cy="100" r="2"/><circle cx="200" cy="100" r="2"/>
    <circle cx="1000" cy="70" r="2"/><circle cx="1060" cy="70" r="2"/><circle cx="1120" cy="70" r="2"/>
    <circle cx="1000" cy="110" r="2"/><circle cx="1060" cy="110" r="2"/><circle cx="1120" cy="110" r="2"/>
  </g>

  <text x="48" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="2" fill="#7eb8bf">SYSTEM MAP</text>
  <text x="48" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#e8fbff">Agents that fetch · reason · act</text>
  <text x="48" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9fd8df">LangGraph · RAG · OCR · MCP · evaluation-minded builds</text>

  <!-- pipeline -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- connectors -->
    <path d="M210 230 H310" stroke="url(#line)" stroke-width="3" fill="none"/>
    <path d="M470 230 H570" stroke="url(#line)" stroke-width="3" fill="none"/>
    <path d="M730 230 H830" stroke="url(#line)" stroke-width="3" fill="none"/>
    <path d="M990 230 H1040" stroke="url(#line)" stroke-width="3" fill="none"/>
    <polygon points="1040,224 1055,230 1040,236" fill="#57db96"/>

    <!-- node 1 -->
    <rect x="48" y="175" width="162" height="110" rx="14" fill="url(#node)" stroke="#33c2cc" stroke-opacity="0.55"/>
    <text x="129" y="220" text-anchor="middle" font-size="13" fill="#7eb8bf">INPUT</text>
    <text x="129" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#e8fbff">Docs · Query</text>

    <!-- node 2 -->
    <rect x="310" y="175" width="160" height="110" rx="14" fill="url(#node)" stroke="#33c2cc" stroke-opacity="0.8"/>
    <text x="390" y="220" text-anchor="middle" font-size="13" fill="#7eb8bf">AGENT</text>
    <text x="390" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#33c2cc">LangGraph</text>

    <!-- node 3 -->
    <rect x="570" y="175" width="160" height="110" rx="14" fill="url(#node)" stroke="#57db96" stroke-opacity="0.7"/>
    <text x="650" y="220" text-anchor="middle" font-size="13" fill="#7eb8bf">RETRIEVE</text>
    <text x="650" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#57db96">RAG · Tools</text>

    <!-- node 4 -->
    <rect x="830" y="175" width="160" height="110" rx="14" fill="url(#node)" stroke="#33c2cc" stroke-opacity="0.55"/>
    <text x="910" y="220" text-anchor="middle" font-size="13" fill="#7eb8bf">ACT</text>
    <text x="910" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#e8fbff">MCP · APIs</text>

    <!-- outcome -->
    <text x="1105" y="226" text-anchor="middle" font-size="13" fill="#7eb8bf">OUT</text>
    <text x="1105" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#57db96">Answer</text>
  </g>
</svg>
